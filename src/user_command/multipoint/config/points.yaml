# 航点按 waypoints 中的排列顺序依次执行。
#
# ==============================================================================
# 航点公共变量定义（修改此处可一键同步给所有引用的航点）
# ==============================================================================
# 变量说明：
# - var_z: 航点飞行高度，单位为米。
# - var_hover_sec: 确认到达航点后、发送云台命令前的悬停时间（秒）。
# - var_gimbal_mode: 云台模式，'range' 表示水平扫描，'angle' 表示指定角度。
# - var_yaw_min / var_yaw_max: range 模式下的扫描范围 [-135, 135]。
# - var_pitch_deg: 云台俯仰角 [-90, 25]，向下为负，向上为正。
# - var_settle_sec: 云台到位后等待画面稳定的时间（秒）。
#
# 使用方式：
# - 所有使用 *var_xxx 的航点均会自动引用上方的变量值；
# - 若某个航点需要单独配置（如特定高度），直接在该航点写具体的数值（如 z: 2.0）即可。
# ==============================================================================
var_z: &var_z 1.0
var_hover_sec: &var_hover_sec 2.0
var_gimbal_mode: &var_gimbal_mode range
var_yaw_min: &var_yaw_min -135.0
var_yaw_max: &var_yaw_max 135.0
var_pitch_deg: &var_pitch_deg -30.0
var_settle_sec: &var_settle_sec 2.0

waypoints:
  - id: 1
    x: 3.0
    y: 0.0
    z: *var_z
    hover_sec: *var_hover_sec
    gimbal_mode: *var_gimbal_mode
    gimbal_yaw_min_deg: *var_yaw_min
    gimbal_yaw_max_deg: *var_yaw_max
    gimbal_pitch_deg: *var_pitch_deg
    gimbal_settle_sec: *var_settle_sec

  - id: 2
    x: 7.0
    y: 0.0
    z: *var_z
    hover_sec: *var_hover_sec
    gimbal_mode: *var_gimbal_mode
    gimbal_yaw_min_deg: *var_yaw_min
    gimbal_yaw_max_deg: *var_yaw_max
    gimbal_pitch_deg: *var_pitch_deg
    gimbal_settle_sec: *var_settle_sec

  - id: 3
    x: 10.0
    y: 0.0
    z: *var_z
    hover_sec: *var_hover_sec
    gimbal_mode: *var_gimbal_mode
    gimbal_yaw_min_deg: *var_yaw_min
    gimbal_yaw_max_deg: *var_yaw_max
    gimbal_pitch_deg: *var_pitch_deg
    gimbal_settle_sec: *var_settle_sec

# 可选返航路线，收到返航触发后按列表顺序执行：
# - 每个元素的格式为 [x, y, z]，单位为米，坐标系与 waypoints 相同。
# - 返航点不执行悬停和云台动作。
# - 不需要返航功能时，可将 test_back 及其坐标行一起注释掉。
test_back:
  - [0.0, 0.0, 1.0]
